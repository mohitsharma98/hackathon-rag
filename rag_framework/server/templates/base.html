<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}RAG Framework{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a0a0f'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-size='20' fill='%2300c8ff'%3E%E2%97%88%3C/text%3E%3C/svg%3E" />
  <script>
    (function() {
      if (localStorage.getItem('theme') === 'light')
        document.documentElement.setAttribute('data-theme', 'light');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/dashboard.css?v={{ static_v }}" />
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>

  <!-- Top navigation bar -->
  <nav class="navbar">
    <div class="navbar-brand">
      <span class="brand-icon">◈</span>
      <span class="brand-name">RAG<span class="brand-accent">FRAMEWORK</span></span>
    </div>

    <div class="navbar-links">
      <a href="/" class="nav-link {% if request.url.path == '/' %}active{% endif %}">
        <span class="nav-icon">⚙</span> Configure
      </a>
      <a href="/evaluate" class="nav-link {% if request.url.path == '/evaluate' %}active{% endif %}">
        <span class="nav-icon">◎</span> Evaluate
      </a>
    </div>

    <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" title="Toggle light/dark mode">
      <span id="theme-icon">☀</span>
    </button>

    <div class="navbar-status" id="nav-status">
      <span class="status-dot" id="status-dot"></span>
      <span class="status-label" id="status-label">idle</span>
    </div>
  </nav>

  <!-- Main content -->
  <main class="main-content">
    {% block content %}{% endblock %}
  </main>

  <!-- Status bar -->
  <footer class="statusbar">
    <span class="statusbar-item" id="sb-config">cfg: <span class="mono accent" id="sb-config-name">—</span></span>
    <span class="statusbar-sep">·</span>
    <span class="statusbar-item">parser: <span class="mono" id="sb-parser">—</span></span>
    <span class="statusbar-sep">·</span>
    <span class="statusbar-item">embedder: <span class="mono" id="sb-embedder">—</span></span>
    <span class="statusbar-sep">·</span>
    <span class="statusbar-item">store: <span class="mono" id="sb-store">—</span></span>
    <span class="statusbar-sep">·</span>
    <span class="statusbar-item">docs: <span class="mono accent2" id="sb-docs">0</span></span>
    <span class="statusbar-sep">·</span>
    <span class="statusbar-item">chunks: <span class="mono accent2" id="sb-chunks">0</span></span>
  </footer>

  <script src="/static/js/dashboard.js?v={{ static_v }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
